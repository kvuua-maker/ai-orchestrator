services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aio
      POSTGRES_USER: aio
      POSTGRES_PASSWORD: aio
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on: [postgres]
    environment:
      DB_HOST: postgres
      DB_USER: aio
      DB_PASSWORD: aio
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
    ports: ["6432:6432"]

  sandbox-base:
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    image: aio/sandbox-base:latest
    profiles: ["build-only"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]

# gVisor: на хості має бути встановлений runsc і доданий у /etc/docker/daemon.json:
#   { "runtimes": { "runsc": { "path": "/usr/bin/runsc" } } }
# Без цього контейнери пісочниці працюють на звичайному runc (слабша ізоляція).

volumes:
  pgdata:
