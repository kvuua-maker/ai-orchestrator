; PgBouncer — обов'язковий між застосунком і Postgres (§33.4.1, ADR 0061)
[databases]
aio = host=postgres port=5432 dbname=aio

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction          ; session не підходить: тримає з'єднання
default_pool_size = 50
max_client_conn = 1000
reserve_pool_size = 10
server_idle_timeout = 60
query_wait_timeout = 30
; SET LOCAL працює всередині транзакції — наш RLS-контекст сумісний
ignore_startup_parameters = extra_float_digits
