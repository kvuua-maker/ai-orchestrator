name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  VAULT_MASTER_KEY: ci-test-key

jobs:
  contracts:
    name: contracts + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run packages/shared

  api:
    name: api + synthetic tenant
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b packages/shared apps/api
      - run: npx vitest run apps/api/tests
        env:
          NODE_ENV: test

  web:
    name: web build
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx next build apps/web

  gate:
    name: release gate
    runs-on: ubuntu-latest
    needs: [contracts, api, web]
    steps:
      - run: echo "All required checks passed. Merge allowed."
